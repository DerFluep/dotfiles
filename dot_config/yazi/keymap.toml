#"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"
#:schema https://yazi-rs.github.io/schemas/keymap.json

# [[mgr.prepend_keymap]]
# on = "!"
# for = "unix"
# run = 'shell "$SHELL" --block'
# dec = "Open $SHELL here"

[mgr]
prepend_keymap = [
  {on = "<C-n>", run = 'shell -- ripdrag -x -A %s 2>/dev/null &'},
  {on = "l", run = "plugin smart-enter", desc = "Enter the child directory, or open the file"},
  {on = "y", run = [
    "shell -- echo %s | xclip -i -selection clipboard -t text/uri-list", "yank"
  ]},
  {on = ["g", "/"], run = "cd /", desc = "Go root", for = "unix"},
  {on = ["g", "m"], run = "cd /mnt/games/", desc = "Go games", for = "unix"},
  {on = ["g", "s"], run = "cd /run/media/", desc = "Go USB", for = "unix"},
]

